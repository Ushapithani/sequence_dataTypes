<!DOCTYPE html>
<html>
<head>
<title>Tuple Operations</title>

<style>
body{
    margin:0;
    background:black;
    font-family:Arial;
    color:white;
}
.container{
    width:420px;
    margin:120px auto;
    background:#111;
    padding:30px;
    text-align:center;
}
h1{margin-bottom:25px;}
input{
    width:90%;
    padding:10px;
    margin-bottom:15px;
    background:black;
    border:1px solid #7c5cff;
    color:white;
}
button{
    width:100%;
    padding:12px;
    margin:8px 0;
    background:black;
    border:1px solid #7c5cff;
    color:white;
    cursor:pointer;
}
button:hover{background:#7c5cff;}
pre{
    background:black;
    padding:15px;
    margin-top:20px;
    text-align:left;
    color:#0f0;
}
a{color:#7c5cff;text-decoration:none;}
</style>
</head>

<body>

<div class="container">
<h1>Tuple Operations</h1>

<input id="data" placeholder="Enter elements (space separated)">
<button onclick="create()">Create Tuple</button>

<button onclick="display()">1. Display</button>
<button onclick="length()">2. Length</button>
<button onclick="first()">3. First Element</button>
<button onclick="last()">4. Last Element</button>
<button onclick="count()">5. Count</button>
<button onclick="index()">6. Index</button>

<pre id="out">Output...</pre>
<a href="index2.html">← Back</a>
</div>

<script>
let tpl=[];

function create(){
    tpl=data.value.split(" ").map(Number);
    out("Tuple created: ("+tpl+")");
}
function display(){ out("Tuple: ("+tpl+")"); }
function length(){ out("Length: "+tpl.length); }
function first(){ out("First: "+tpl[0]); }
function last(){ out("Last: "+tpl[tpl.length-1]); }
function count(){
    let x=Number(prompt("Enter element"));
    out("Count: "+tpl.filter(e=>e===x).length);
}
function index(){
    let x=Number(prompt("Enter element"));
    let i=tpl.indexOf(x);
    out(i!==-1 ? "Index: "+i : "Not found");
}
function out(msg){
    document.getElementById("out").innerText=msg;
}
</script>

</body>
</html>
